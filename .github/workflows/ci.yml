name: ci

# Thin on purpose: what every commit must hold (no large file, no ELF, Mach-O, PE, WebAssembly or ar-archive file),
# format, vet and build. The tests run on the machine before a push (AGENTS.md). The repository is public, so the
# jobs use GitHub's runners.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # main keeps every commit of a pull request, so each one is read, not only the head: a file a commit adds and a
  # later one deletes stays in main's history for good. Both a pull request and a push read their head's whole
  # history (a fraction of a second), never a range from a base: a base that moves, is rewound or was never read
  # cannot hide a commit, and a push whose run was cancelled or replaced is read by the next. The check is built
  # from the checked-out tree, so a change to internal/tracked or to this file is read by its own copy: review
  # those by hand (AGENTS.md).
  tracked:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: no file over 1 MiB and no ELF, Mach-O, PE, WebAssembly or ar-archive file in any commit
        env:
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: go run ./internal/tracked/check "$HEAD"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
